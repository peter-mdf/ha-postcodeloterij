name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: Validate with HACS Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: >-
          python -m pytest tests/
          --cov=custom_components.postcodeloterij
          --cov-fail-under=95 -v

  ruff:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ruff.toml is Home Assistant core's ruleset; the version matches
      # core's pin so a new ruff release can't turn the build red overnight.
      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.0"
          args: check

      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.0"
          args: format --check

  mypy:
    name: Type-check with mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt mypy==2.4.0

      - name: mypy
        run: mypy custom_components/postcodeloterij --ignore-missing-imports
